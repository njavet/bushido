[project]
name = "telegram-bot"
version = "0.1.0"
requires-python = ">=3.14,<4"

dependencies = [
    "bushidolib",
    "httpx>=0.28",
    "telethon>=1.43",
]

[tool.uv.sources]
bushidolib = { workspace = true }

[project.scripts]
telegram-bot = "telegram_bot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_bot"]


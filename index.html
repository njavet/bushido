<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUSHIDO // CITADEL</title>

  <style>
    :root {
      --bg: #050608;
      --panel: #0a0d10;
      --green: #00ff9c;
      --cyan: #00d9ff;
      --red: #ff3158;
      --dim: #53616a;
      --text: #c7d4d8;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        linear-gradient(rgba(0, 255, 156, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 156, 0.025) 1px, transparent 1px),
        var(--bg);
      background-size: 40px 40px;
      color: var(--text);
      font-family: "Courier New", monospace;
    }
    .terminal {
      width: min(900px, 90vw);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #19352e;
    }
    .title {
      color: var(--green);
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 0.2em;
      text-shadow: 0 0 10px rgba(0, 255, 156, 0.6);
    }
    .status {
      color: var(--dim);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
    }
    .status.online {
      color: var(--green);
    }
    .status.error {
      color: var(--red);
    }
    .prompt {
      display: flex;
      align-items: center;
      background: var(--panel);
      border: 1px solid #1a3d34;
      box-shadow:
        0 0 30px rgba(0, 255, 156, 0.06),
        inset 0 0 20px rgba(0, 255, 156, 0.015);
    }
    .prompt-symbol {
      padding-left: 18px;
      color: var(--green);
      font-weight: bold;
      font-size: 1.2rem;
      text-shadow: 0 0 8px rgba(0, 255, 156, 0.8);
    }
    input {
      width: 100%;
      padding: 18px 14px;
      border: none;
      outline: none;
      background: transparent;
      color: var(--cyan);
      font-family: inherit;
      font-size: 1.05rem;
      caret-color: var(--green);
    }
    input::placeholder {
      color: #35434a;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      color: #344149;
      font-size: 0.7rem;
      letter-spacing: 0.08em;
    }
    #message {
      min-height: 1.2em;
      margin-top: 18px;
      font-size: 0.8rem;
    }
    .success {
      color: var(--green);
    }
    .failure {
      color: var(--red);
    }
    .sending {
      color: var(--cyan);
    }
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.012),
          rgba(255, 255, 255, 0.012) 1px,
          transparent 1px,
          transparent 3px
        );
    }
    [hidden] { display: none !important; }
    button { font: inherit; color: var(--green); background: var(--panel); border: 1px solid #1a3d34; padding: 12px 16px; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .auth-title { font-size: .85rem; color: var(--cyan); letter-spacing: .12em; margin: 24px 0 16px; }
    .auth-field { display: block; margin-bottom: 12px; }
    .auth-field > span { display: block; font-size: .75rem; color: var(--dim); margin-bottom: 6px; }
    .auth-field input { background: var(--panel); border: 1px solid #1a3d34; }
    .actions { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-top: 16px; }
    .link-button { border: 0; background: transparent; color: var(--dim); }
    #identity { color: var(--cyan); font-size: .8rem; }
    #demo-banner { color: var(--cyan); font-size: .75rem; margin-bottom: 20px; }
    @media (max-width: 480px) { .header { align-items: start; gap: 12px; flex-direction: column; } .footer { gap: 12px; } }
  </style>
</head>

<body>
  <main class="terminal">
    <header class="header">
      <div class="title">BUSHIDO</div>
   	  <div id="status" class="status online">CITADEL // ONLINE</div>
    </header>

    <div id="demo-banner" hidden>DEMO MODE // NO SERVER AUTHENTICATION OR DATA STORAGE</div>
    <section id="auth-screen" hidden>
      <h1 id="auth-title" class="auth-title">SPARTAN IDENTIFICATION</h1>
      <form id="auth-form">
        <label class="auth-field"><span>USERNAME</span><input id="username" name="username" autocomplete="username" required maxlength="128"></label>
        <label class="auth-field"><span>PASSWORD</span><input id="password" name="password" type="password" autocomplete="current-password" required></label>
        <label id="confirm-field" class="auth-field" hidden><span>CONFIRM PASSWORD</span><input id="confirm-password" type="password" autocomplete="new-password"></label>
        <div class="actions">
          <button id="auth-submit" type="submit">AUTHENTICATE</button>
          <button id="auth-switch" class="link-button" type="button">NO IDENTITY? // ENLIST</button>
        </div>
      </form>
    </section>
    <section id="log-screen" hidden>
      <div class="actions" style="margin: 0 0 16px"><span id="identity"></span><button id="logout" class="link-button" type="button">LOG OUT</button></div>
      <form id="unit-form">
        <div class="prompt">
          <label class="prompt-symbol" for="unit">&gt;</label>
          <input id="unit" type="text" autocomplete="off" spellcheck="false" placeholder="enter unit..." aria-label="Unit command" required>
        </div>
      </form>
    </section>
    <div id="message" role="status" aria-live="polite"></div>
    <footer class="footer">
      <span id="footer-label">SESSION CHECK</span>
      <span id="footer-hint">PLEASE WAIT</span>
    </footer>
  </main>

  <script>
    // Serve this page and Citadel under the same origin, with Citadel at /api.
    const API_BASE = "/api";
    // Explicit local preview only. Never provides authentication.
    const DEMO = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname)
      && new URLSearchParams(location.search).get("demo") === "1";
    const el = (id) => document.getElementById(id);
    let signup = false;
    let demoUser = null;
    let busy = false;

    function message(text = "", kind = "") {
      el("message").textContent = text;
      el("message").className = kind;
    }
    function showUser(user) {
      const loggedIn = Boolean(user);
      el("auth-screen").hidden = loggedIn;
      el("log-screen").hidden = !loggedIn;
      el("status").className = "status online";
      el("status").textContent = DEMO ? "CITADEL // DEMO" : "CITADEL // CONNECTED";
      el("identity").textContent = user ? `SPARTAN // ${user.username}` : "";
      el("footer-label").textContent = loggedIn ? "UNIT LOG INTERFACE" : "SPARTAN IDENTIFICATION";
      el("footer-hint").textContent = loggedIn ? "ENTER // TRANSMIT" : "ENTER // AUTHENTICATE";
      (loggedIn ? el("unit") : el("username")).focus();
    }
    function setBusy(value) {
      busy = value;
      for (const control of document.querySelectorAll("input, button")) control.disabled = value;
    }
    async function request(path, body) {
      const response = await fetch(API_BASE + path, {
        method: body === undefined ? "GET" : "POST",
        credentials: "same-origin",
        headers: body === undefined ? {} : { "Content-Type": "application/json" },
        ...(body === undefined ? {} : { body: JSON.stringify(body) }),
      });
      const text = await response.text();
      let data;
      try { data = text ? JSON.parse(text) : null; } catch { data = null; }
      if (!response.ok) {
        const detail = typeof data?.detail === "string" ? data.detail : `Request failed (${response.status}).`;
        const error = new Error(detail);
        error.status = response.status;
        throw error;
      }
      return data;
    }
    function validUser(user) {
      if (!user || typeof user.username !== "string") throw new Error("Invalid /auth/me response: expected a username.");
      return user;
    }
    el("auth-switch").addEventListener("click", () => {
      signup = !signup;
      el("auth-title").textContent = signup ? "SPARTAN ENLISTMENT" : "SPARTAN IDENTIFICATION";
      el("confirm-field").hidden = !signup;
      el("confirm-password").required = signup;
      el("password").autocomplete = signup ? "new-password" : "current-password";
      el("auth-submit").textContent = signup ? "CREATE ACCOUNT" : "AUTHENTICATE";
      el("auth-switch").textContent = signup ? "EXISTING IDENTITY? // LOG IN" : "NO IDENTITY? // ENLIST";
      el("password").value = el("confirm-password").value = "";
      message();
    });
    el("auth-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      if (busy) return;
      const username = el("username").value.trim();
      const password = el("password").value;
      if (!username) { message("[ USERNAME REQUIRED ]", "failure"); return; }
      if (signup && password !== el("confirm-password").value) {
        message("[ PASSWORDS DO NOT MATCH ]", "failure"); return;
      }
      setBusy(true);
      message("[ AUTHENTICATING ]", "sending");
      try {
        let user;
        if (DEMO) { demoUser = { username }; user = demoUser; }
        else {
          await request(signup ? "/auth/signup" : "/auth/login", { username, password });
          user = validUser(await request("/auth/me"));
        }
        el("password").value = el("confirm-password").value = "";
        showUser(user);
        message(DEMO ? "[ DEMO SESSION // NOT AUTHENTICATED ]" : "[ AUTHENTICATED ]", "success");
      } catch (error) { message(`[ AUTHENTICATION FAILED ] ${error.message}`, "failure"); }
      finally { setBusy(false); (el("log-screen").hidden ? el("password") : el("unit")).focus(); }
    });
    el("logout").addEventListener("click", async () => {
      if (busy) return;
      setBusy(true);
      try {
        if (!DEMO) await request("/auth/logout", {});
        demoUser = null;
        el("unit").value = "";
        showUser(null);
        message("[ LOGGED OUT ]", "success");
      } catch (error) { message(`[ LOGOUT FAILED ] ${error.message}`, "failure"); }
      finally { setBusy(false); if (el("log-screen").hidden) el("username").focus(); }
    });
    el("unit-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const line = el("unit").value.trim();
      if (!line || busy) return;
      setBusy(true);
      message("[ TRANSMITTING ]", "sending");
      try {
        if (!DEMO) await request("/unit-logs", { line });
        el("unit").value = "";
        message(DEMO ? "[ DEMO UNIT ACCEPTED // NOT SAVED ]" : "[ UNIT LOGGED ]", "success");
      } catch (error) {
        if (error.status === 401) {
          showUser(null);
          message("[ SESSION EXPIRED // LOG IN AGAIN ]", "failure");
        } else { message(`[ TRANSMISSION FAILED ] ${error.message}`, "failure"); }
      } finally { setBusy(false); (el("log-screen").hidden ? el("username") : el("unit")).focus(); }
    });
    async function initialize() {
      el("demo-banner").hidden = !DEMO;
      message("[ CHECKING SESSION ]", "sending");
      setBusy(true);
      try {
        if (DEMO) { showUser(demoUser); message(); }
        else { showUser(validUser(await request("/auth/me"))); message(); }
      } catch (error) {
        showUser(null);
        if (error.status === 401) message();
        else {
          el("status").textContent = "CITADEL // UNAVAILABLE";
          el("status").className = "status error";
          message(`[ SESSION CHECK FAILED ] ${error.message}`, "failure");
        }
      } finally { setBusy(false); (el("log-screen").hidden ? el("username") : el("unit")).focus(); }
    }
    initialize();
  </script>

</body>
</html>

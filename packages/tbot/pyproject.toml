[project]
name = "tbot"
version = "0.1.0"
requires-python = ">=3.14,<4"

dependencies = [
    "bushidolib",
    "bushido_client",
    "httpx>=0.28",
    "telethon>=1.43",
]

[tool.uv.sources]
bushidolib = { workspace = true }
bushido_client = { workspace = true }

[project.scripts]
tbot = "tbot.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tbot"]


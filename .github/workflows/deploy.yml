name: deploy

on:
  push:
    branches:
      - main
    paths:
      - "packages/citadel/**"
      - "uv.lock"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  ACR_NAME: acrbushidoprodnjg
  ACR_REPOSITORY: citadel
  RESOURCE_GROUP: rg-bushido-prod
  CONTAINER_APP: ca-bushido-api-prod
  MIGRATION_JOB: job-bushido-migration-prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get ACR login server
        id: acr
        run: |
          ACR_SERVER=$(az acr show \
            --name "$ACR_NAME" \
            --query loginServer \
            -o tsv)

          echo "server=$ACR_SERVER" >> "$GITHUB_OUTPUT"

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build image
        run: |
          docker build \
            -f packages/citadel/Dockerfile \
            -t "${{ steps.acr.outputs.server }}/${ACR_REPOSITORY}:${{ github.sha }}" \
            .

      - name: Push image
        run: |
          docker push \
            "${{ steps.acr.outputs.server }}/${ACR_REPOSITORY}:${{ github.sha }}"

      - name: Update migration image
        run: |
          az containerapp job update \
            --name "$MIGRATION_JOB" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.acr.outputs.server }}/${ACR_REPOSITORY}:${{ github.sha }}"

      - name: Run database migrations
        run: |
          EXECUTION=$(az containerapp job start \
            --name "$MIGRATION_JOB" \
            --resource-group "$RESOURCE_GROUP" \
            --query name \
            -o tsv)

          echo "Migration execution: $EXECUTION"

          for i in {1..60}; do
            STATUS=$(az containerapp job execution show \
              --name "$MIGRATION_JOB" \
              --resource-group "$RESOURCE_GROUP" \
              --job-execution-name "$EXECUTION" \
              --query properties.status \
              -o tsv)

            echo "Migration status: $STATUS"

            if [ "$STATUS" = "Succeeded" ]; then
              exit 0
            fi

            if [ "$STATUS" = "Failed" ]; then
              echo "Database migration failed"
              exit 1
            fi

            sleep 5
          done

          echo "Timed out waiting for database migration"
          exit 1

      - name: Deploy image
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "${{ steps.acr.outputs.server }}/${ACR_REPOSITORY}:${{ github.sha }}"

      - name: Smoke test deployment
        run: |
          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          for i in {1..30}; do
            if curl --fail "https://${FQDN}/health/live"; then
              exit 0
            fi
            sleep 5
          done

          exit 1
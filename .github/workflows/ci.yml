name: CI

on: 
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Dependencies
        run: uv sync --all-packages --frozen

      - name: Run Ruff check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Typechecker
        run: uv run mypy 

      - name: Run tests
        run: uv run pytest 

      - name: Build bushidolib
        run: uv build --package bushidolib

      - name: Build server
        run: uv build --package bushido-server

      - name: Build tui client
        run: uv build --package tui-client

      - name: Build server Docker image
        run: |
          docker build \
            -f bushido-server/Dockerfile \
            -t bushido-server:${{ github.sha }} \
            .

      - name: Smoke test container
        run: |
          docker run -d \
            --name bushido-server \
            -p 8000:8000 \
            bushido-server:${{ github.sha }}

          sleep 3

          curl --fail http://localhost:8000/docs

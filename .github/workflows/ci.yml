name: CI

on: 
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: install dependencies
        run: uv sync --all-packages --frozen

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy 

      - name: tests
        run: uv run pytest 

      - name: build server
        run: uv build --package citadel

      - name: build server docker image
        run: |
          docker build \
            -f packages/citadel/Dockerfile \
            -t citadel:${{ github.sha }} \
            .

      - name: smoke test container
        run: |
          docker run -d \
            --name citadel-smoke \
            -e DB_BACKEND=sqlite \
            -e SQLITE_PATH=/tmp/citadel-smoke.db \
            -p 8000:8000 \
            citadel:${{ github.sha }}

      - name: check HTTP endpoint
        run: | 
          for i in {1..20}; do
            if curl --fail http://localhost:8000/health/live; then
              exit 0
            fi
            sleep 1
          done

          docker logs citadel-smoke
          exit 1

      - name: stop smoke-test container
        if: always()
        run: docker rm -f citadel-smoke || true

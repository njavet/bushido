name: CI

on: 
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Dependencies
        run: uv sync --all-packages --frozen

      - name: Run Ruff check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Typechecker
        run: uv run mypy 

      - name: Run tests
        run: uv run pytest 

      - name: Build bushidolib
        run: uv build --package bushidolib

      - name: Build server
        run: uv build --package bushido-server

      - name: Build tui client
        run: uv build --package tui-client



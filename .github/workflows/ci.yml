name: CI

on: 
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: install uv
        uses: astral-sh/setup-uv@v6

      - name: install dependencies
        run: uv sync --all-packages --frozen

      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: mypy
        run: uv run mypy 

      - name: tests
        run: uv run pytest 

      - name: build bushidolib
        run: uv build --package bushidolib

      - name: build server
        run: uv build --package bushido-server

      - name: build tui client
        run: uv build --package tui-client

      - name: build server docker image
        run: |
          docker build \
            -f bushido-server/Dockerfile \
            -t bushido-server:${{ github.sha }} \
            .

      - name: smoke test container
        run: |
          docker run -d \
            --name bushido-server \
            -p 8000:8000 \
            bushido-server:${{ github.sha }}
          
          for i in {1..20}; do
            if curl --fail http://localhost:8000/api/health/live; then
              exit 0
            fi
            sleep 1
          done

          docker logs bushido-server
          exit 1

      - name: stop smoke-test container
        if: always()
        run: docker rm -f bushido-server || true

[project]
name = "bushido"
version = "0.1.0"
requires-python = ">=3.14,<4.0.0"

[tool.uv.workspace]
members = [
    "bushido-server",
    "tui-client",
]

[tool.ruff]
line-length = 88
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
packages = ["bushido_server", "tui_client", "tests"]
strict = true
show_error_codes = true
pretty = true

[project]
name = "bushido"
version = "0.1.0"
requires-python = ">=3.14,<4"

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ipython>=9.13.0",
    "pre-commit>=4.6.2",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
bushidolib = { workspace = true }
bushido-server = { workspace = true }
bushido-client = { workspace = true }
tui-client = { workspace = true }
telegram-bot = { workspace = true }

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py314"
line-length = 88
indent-width = 4
src = [
    "bushidolib/src",
    "bushido-server/src",
    "bushido-client/src",
    "tui-client/src",
	"telegram-bot/src",
]

exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "scripts",
    "dist",
    "build",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # builtins shadowing
    "C4",     # comprehensions
    "DTZ",    # datetime timezone correctness
    "T10",    # debugger statements
    "ISC",    # implicit string concatenation
    "ICN",    # import conventions
    "PIE",    # misc simplifications
    "PT",     # pytest style
    "Q",      # quotes
    "RET",    # return style
    "SIM",    # simplifications
    "ARG",    # unused arguments
    "PTH",    # pathlib
    "ERA",    # commented-out code
    "PL",     # pylint-derived rules
    "RUF",    # Ruff-specific rules
]

ignore = [
    "PLR0913", # too many arguments; sometimes legitimate in adapters/constructors
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = [
    "ARG001",  # fixtures/callback signatures may intentionally leave args unused
    "PLR2004", # magic values are often fine in tests
]

[tool.ruff.lint.isort]
known-first-party = [
    "busidolib",
    "bushido_server",
    "bushido_client",
    "tui_client",
	"telegram-bot",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true

files = ["packages"]
mypy_path = [
    "packages/bushidolib/src",
    "packages/bushido_server/src",
    "packages/bushido_client/src",
    "packages/tui_client/src",
    "packages/telegram_bot/src",
]

pretty = true
show_column_numbers = true
show_error_context = true

warn_unreachable = true
strict_bytes = true
disallow_any_unimported = true
local_partial_types = true

enable_error_code = [
    "explicit-override",
    "ignore-without-code",
    "possibly-undefined",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "unused-awaitable",
]

plugins = [
    "sqlalchemy.ext.mypy.plugin",
]
[[tool.mypy.overrides]]
module = [
    "telethon",
    "telethon.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["packages/*/tests"]

addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
]
markers = ["integration", "unit"]

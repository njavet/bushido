[project]
name = "bushidolib"
version = "0.1.0"
description = "Track Trainings and Study Time"
authors = [
    {name = "Noe Javet", email = "np.javet@gmail.com"}
]
license = {text = "GPL-3"}
readme = "README.md"
requires-python = ">=3.14,<4.0.0"
dependencies = [
    "platformdirs>=4.9.6",
    "polars>=1.41.2",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = 'hatchling.build'

[tool.hatch.build.targets.wheel]
packages = ['src/bushidolib']
